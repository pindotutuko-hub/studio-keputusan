<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detektif Ruang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea;--card:#fffdf9;--ink:#1f1c18;--muted:#6d655a;--line:#ddd3c4;
  --room:#efe6d7;--roomh:#e4d3b8;--block:#ded5c6;--gang:#f7f2ea;--blockline:#cfc4b2;
  --accent:#8a2b2b;--accent2:#b5523b;--accentSoft:#f3e2dc;--door:#c9922e;--ok:#2f7d4f;--okSoft:#e1f1e6;--bad:#a33a2a;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 24px rgba(40,30,20,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f;--card:#1f1c17;--ink:#f2ece2;--muted:#a69d8f;--line:#38322a;
  --room:#2b2720;--roomh:#3b3428;--block:#26221c;--gang:#3a342b;--blockline:#322d25;
  --accent:#e08a7a;--accent2:#e3a06c;--accentSoft:#3a2420;--door:#d9a648;--ok:#6cc58f;--okSoft:#1c3326;--bad:#ef8a78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand h1{font-size:22px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.pill b{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:15px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)}.dot.done{background:var(--ok)}.dot.miss{background:var(--accent2)}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.plan{padding:14px}
.planhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 10px;flex-wrap:wrap}
.planhead h2{font-size:18px}
.planhead span{color:var(--muted);font-size:13px}
#planSvg{width:100%;height:auto;display:block;touch-action:manipulation;max-height:70vh}
.room{cursor:pointer;transition:fill .25s}
.room:hover{fill:var(--roomh)}
.revealed .room{cursor:pointer}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:8px 6px 0}
.legend .bar{flex:1;height:10px;border-radius:6px;max-width:260px}
.side{padding:18px;display:flex;flex-direction:column;gap:14px}
.q{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:20px;line-height:1.3}
.q em{font-style:normal;color:var(--accent)}
.hint{color:var(--muted);font-size:13.5px}
.timer{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.sel{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;min-height:44px;display:flex;align-items:center;gap:8px}
.sel b{color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
@media (prefers-color-scheme:dark){.btn{color:#1a120f}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.verdict{border-radius:14px;padding:12px 14px;font-weight:600}
.verdict.good{background:var(--okSoft);color:var(--ok)}
.verdict.meh{background:var(--accentSoft);color:var(--accent)}
.verdict small{display:block;font-weight:500;color:var(--ink);opacity:.85;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.jg{border:1px solid var(--line);border-radius:12px;padding:8px}
.jg h3{font-size:14px;margin:0 2px 4px}
.jg p{margin:0 2px 6px;font-size:12px;color:var(--muted)}
#jgSvg{width:100%;height:auto;display:block}
.lesson{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
.lesson b{font-family:"Space Grotesk",Inter,sans-serif}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
code{font-size:12.5px}
.intro{padding:26px;display:grid;gap:18px;grid-template-columns:1.2fr 1fr;align-items:center}
@media (max-width:860px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:30px;line-height:1.15}
.intro ol{padding-left:20px;margin:6px 0 0}
.intro li{margin:6px 0}
.big{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:46px;font-weight:700;color:var(--accent);line-height:1}
footer{margin-top:22px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted)}
.panel{padding:24px;max-width:1180px}
.form{display:grid;gap:10px;max-width:440px;margin-top:12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.msg{min-height:1.2em;color:var(--bad);font-size:13px;margin:0}
.codeBig{font-family:"Space Grotesk",Inter,sans-serif;font-size:56px;font-weight:700;letter-spacing:.12em;color:var(--accent);line-height:1}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:110px}
.kpi b{display:block;font-family:"Space Grotesk",Inter,sans-serif;font-size:24px}
.kpi span{font-size:12px;color:var(--muted)}
.dashgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:12px}
@media (max-width:860px){.dashgrid{grid-template-columns:1fr}}
.case{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.case h4{margin:0 0 6px;font-size:13.5px}
.hb{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}
.hb i{display:block;height:8px;border-radius:4px;background:var(--accent2)}
.hb i.ok{background:var(--ok)}
.hb .nm{width:120px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);border-radius:8px;padding:8px 10px;word-break:break-all}
.sess{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.clsres{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.home{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px 7px 8px;font-weight:700;font-size:13px}
.home:hover{border-color:var(--accent);color:var(--accent)}
.hidden{display:none!important}
.mobLock{position:fixed;left:12px;right:12px;bottom:12px;z-index:5;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:860px){.mobLock.show{display:block}.wrap{padding-bottom:90px}}
.sumtab td:nth-child(2){text-align:left}
</style>
</head>

<div class="wrap">
  <header>
    <a class="home" href="https://pindotutuko.id/" title="Beranda pindotutuko.id"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-t="home"></span></a>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20"/><path d="M7.5 10h5M10 7.5v5"/></svg></div>
    <div class="brand"><h1>Detektif Ruang</h1><p data-t="tag"></p></div>
    <div class="hud">
      <div class="dots" id="dots"></div>
      <div class="pill"><span data-t="score"></span> <b id="score">0</b></div>
      <button class="lang" id="langBtn">EN</button>
    </div>
  </header>

  <section class="card intro" id="intro">
    <div>
      <h2 data-t="introH"></h2>
      <p class="hint" data-t="introP"></p>
      <ol>
        <li data-t="i1"></li>
        <li data-t="i2"></li>
        <li data-t="i3"></li>
      </ol>
      <div class="row" style="margin-top:14px"><button class="btn" id="startBtn" data-t="start"></button><button class="btn ghost cls hidden" id="joinOpen" data-t="joinOpen"></button><button class="btn ghost cls hidden" id="hostOpen" data-t="hostOpen"></button></div>
      <p class="hint" id="bestLine" style="margin-top:10px"></p>
    </div>
    <svg id="introSvg" viewBox="0 0 300 220" role="img" aria-label="Justified graph"></svg>
  </section>

  <section class="card panel hidden" id="joinBox">
    <h2 data-t="joinH"></h2>
    <p class="hint" data-t="joinP"></p>
    <form id="joinForm" class="form">
      <label><span data-t="fCode"></span><input id="jCode" maxlength="6" autocomplete="off" autocapitalize="characters" required placeholder="ABC234"></label>
      <label><span data-t="fName"></span><input id="jName" maxlength="60" required></label>
      <label><span data-t="fNim"></span><input id="jNim" maxlength="30"></label>
      <div class="row"><button class="btn" type="submit" data-t="joinGo"></button><button class="btn ghost back" type="button" data-t="back"></button></div>
      <p class="msg" id="jMsg"></p>
    </form>
  </section>

  <section class="card panel hidden" id="hostBox">
    <div id="hostHome">
      <h2 data-t="hostH"></h2>
      <p class="hint" data-t="hostP"></p>
      <div id="hostGate"></div>
      <form id="createForm" class="form hidden">
        <label><span data-t="fTitle"></span><input id="hTitle" maxlength="80" required></label>
        <label><span data-t="fMode"></span><select id="hMode"><option value="mix" data-t="mMix"></option><option value="int" data-t="mInt"></option><option value="seg" data-t="mSeg"></option></select></label>
        <div class="row" style="gap:10px"><label style="flex:1"><span data-t="fN"></span><select id="hN"></select></label>
        <label style="flex:1"><span data-t="fLimit"></span><select id="hLimit"><option>15</option><option>20</option><option selected>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select></label></div>
        <div class="row"><button class="btn" type="submit" data-t="create"></button><button class="btn ghost back" type="button" data-t="back"></button></div>
        <p class="msg" id="hMsg"></p>
      </form>
      <div id="mySess"></div>
    </div>
    <div id="dash" class="hidden"></div>
  </section>

  <section class="card intro hidden" id="endBox"></section>

  <section class="grid hidden" id="game">
    <div class="card plan">
      <div class="planhead"><h2 id="lvTitle"></h2><span id="lvSub"></span></div>
      <svg id="planSvg" role="img"></svg>
      <div class="legend hidden" id="legend"><span data-t="seg"></span><div class="bar" id="legendBar"></div><span data-t="int"></span></div>
    </div>
    <div class="card side" id="side"></div>
  </section>

  <button class="btn mobLock" id="mobLock"></button>
  <footer>
    <span data-t="ref"></span>
    <span><span data-t="by"></span> <a href="https://pindotutuko.id" target="_blank" rel="noopener">pindotutuko.id</a></span>
  </footer>
</div>

/* ---------- Space syntax computation ---------- */
function analyze(L){
  var ids=L.rooms.map(function(r){return r.k}),adj={},k=ids.length;
  ids.forEach(function(i){adj[i]=[]});
  L.doors.forEach(function(d){adj[d[0]].push(d[1]);adj[d[1]].push(d[0])});
  var Dk=2*(k*(Math.log2((k+2)/3)-1)+1)/((k-1)*(k-2));
  var res={};
  ids.forEach(function(s){
    var dep={},q=[s];dep[s]=0;
    while(q.length){var u=q.shift();adj[u].forEach(function(v){if(dep[v]==null){dep[v]=dep[u]+1;q.push(v)}})}
    var TD=0;ids.forEach(function(i){TD+=dep[i]});
    var MD=TD/(k-1),RA=2*(MD-1)/(k-2),RRA=RA/Dk;
    res[s]={dep:dep,TD:TD,MD:MD,RA:RA,RRA:RRA,I:RA>0?1/RRA:Infinity};
  });
  return {ids:ids,adj:adj,k:k,Dk:Dk,res:res};
}
function sharedEdge(a,b){
  var e=1e-9,ov,lo,hi;
  if(Math.abs(a.x+a.w-b.x)<e||Math.abs(b.x+b.w-a.x)<e){
    var x=Math.abs(a.x+a.w-b.x)<e?b.x:a.x;lo=Math.max(a.y,b.y);hi=Math.min(a.y+a.h,b.y+b.h);
    if(hi-lo>e)return {v:true,x:x,lo:lo,hi:hi};
  }
  if(Math.abs(a.y+a.h-b.y)<e||Math.abs(b.y+b.h-a.y)<e){
    var y=Math.abs(a.y+a.h-b.y)<e?b.y:a.y;lo=Math.max(a.x,b.x);hi=Math.min(a.x+a.w,b.x+b.w);
    if(hi-lo>e)return {v:false,y:y,lo:lo,hi:hi};
  }
  return null;
}

function drawJG(svg,A,L,root,small){
  svg.innerHTML='';var dep=A.res[root].dep,levels=[],max=0;
  A.ids.forEach(function(i){var d=dep[i];max=Math.max(max,d);(levels[d]=levels[d]||[]).push(i)});
  var W=320,gap=small?40:54,top=22,bot=30,H=top+bot+max*gap,pos={},crowd={};
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  levels.forEach(function(row,d){
    if(d>0)row.sort(function(a,b){function bc(n){var s=0,c=0;A.adj[n].forEach(function(m){if(dep[m]===d-1){s+=pos[m].x;c++}});return c?s/c:W/2}return bc(a)-bc(b)});
    row.forEach(function(n,j){pos[n]={x:W*(j+1)/(row.length+1),y:H-bot-d*gap};crowd[n]=(W/(row.length+1)<66)&&(j%2===1)});
  });
  var nm={};L.rooms.forEach(function(r){nm[r.k]=r.n[lang]});
  for(var d=0;d<=max;d++){el('line',{x1:8,x2:W-8,y1:H-bot-d*gap,y2:H-bot-d*gap,stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'2 4'},svg);var lt=el('text',{x:6,y:H-bot-d*gap-5,'font-size':9,fill:'var(--muted)'},svg);lt.textContent=d}
  L.doors.forEach(function(e){var a=pos[e[0]],b=pos[e[1]];
    if(a.y===b.y){var my=a.y-gap*0.35;el('path',{d:'M'+a.x+' '+a.y+' Q'+((a.x+b.x)/2)+' '+my+' '+b.x+' '+b.y,stroke:'var(--muted)','stroke-width':1.4,fill:'none'},svg)}
    else el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'var(--muted)','stroke-width':1.4},svg)});
  A.ids.forEach(function(n){var p=pos[n],c=heat(heatT(A,n)),r=small?9:12;
    var g=el('g',{},svg);var title=el('title',{},g);title.textContent=nm[n]+' · '+t('I')+' '+fmt(A.res[n].I,2);
    el('circle',{cx:p.x,cy:p.y,r:r,fill:rgb(c),stroke:n===root?'var(--ink)':'var(--card)','stroke-width':n===root?2.5:1.5},g);
    if(n===root){el('circle',{cx:p.x,cy:p.y,r:r+4,fill:'none',stroke:'var(--ink)','stroke-width':1},g)}
    var tx=el('text',{x:p.x,y:crowd[n]?p.y-r-5:p.y+r+11,'text-anchor':'middle','font-size':small?8.5:9.5,fill:'var(--ink)','font-weight':600},g);
    var s=nm[n];var lim=crowd[n]!==undefined&&W/(levels[dep[n]].length+1)<66?10:14;tx.textContent=s.length>lim?s.slice(0,lim-1)+'…':s;var bg=tx.cloneNode(true);bg.setAttribute('stroke','var(--card)');bg.setAttribute('stroke-width','3');bg.setAttribute('stroke-linejoin','round');g.insertBefore(bg,tx);
  });
}

/* ---------- Flow ---------- */
function loadLevel(){var L=st.R[st.i];st.A=analyze(L);st.sel=null;st.focus=null;st.phase='guess';st.t0=Date.now();
  $('lvTitle').textContent=L.title[lang];$('lvSub').textContent=t('round',{n:st.i+1,t:st.R.length})+(st.cls?' · '+t('inClass',{t:st.cls.title}):'');
  drawPlan();renderSide();dots();clearInterval(st.timer);st.timer=setInterval(tick,250)}
function tick(){if(st.phase!=='guess')return;var el_=(Date.now()-st.t0)/1000,rem=Math.max(0,st.limit-el_);var b=$('tbar');if(b)b.style.width=(rem/st.limit*100)+'%';if(rem<=0){lockAnswer(true)}}
function mob(){var m=$('mobLock');m.textContent=t('lock')+(st.sel?' · '+nameOf(st.R[st.i],st.sel):'');m.classList.toggle('show',st.phase==='guess'&&!!st.sel)}
function onRoom(k){
  if(st.phase==='guess'){st.sel=k;drawPlan();var sb=$('selBox');if(sb)sb.innerHTML=t('picked')+' <b>'+nameOf(st.R[st.i],k)+'</b>';$('lockBtn').disabled=false;mob()}
  else if(st.phase==='reveal'){st.focus=k;drawPlan();var L=st.R[st.i];document.querySelector('.jg h3').textContent=t('jgH',{r:nameOf(L,k)});drawJG($('jgSvg'),st.A,L,k,false)}
}
function lockAnswer(timeout){
  if(st.phase!=='guess')return;clearInterval(st.timer);
  var L=st.R[st.i],A=st.A,el_=(Date.now()-st.t0)/1000,h={pick:st.sel,pts:0,bonus:0,correct:false,rank:0,timeout:false};
  if(!st.sel){h.timeout=true}
  else{var mine=A.res[st.sel].TD,better=A.ids.filter(function(i){return L.q==='int'?A.res[i].TD<mine:A.res[i].TD>mine}).length;
    h.rank=better+1;h.correct=better===0;var base=Math.round(100*(1-better/(A.k-1)));
    h.bonus=h.correct?Math.max(0,Math.round(20*(st.limit-el_)/st.limit)):0;h.pts=base+h.bonus}
  st.hist[st.i]=h;st.score+=h.pts;$('mobLock').classList.remove('show');$('score').textContent=st.score;
  st.phase='reveal';st.focus=L.rooms[0].k;drawPlan();renderSide();dots();
}
function next(){if(st.i<st.R.length-1){st.i++;loadLevel();window.scrollTo({top:0,behavior:'smooth'})}else renderEnd()}
function start(){if(!st.cls){setRounds(randomRounds());st.limit=LIMIT_SOLO}st.i=0;st.score=0;st.hist=[];$('score').textContent='0';
  showOnly('game');loadLevel()}

function drawIntroArt(){
  var svg=$('introSvg');if(!svg)return;var L=LEVELS[1],A=analyze(L);drawJG(svg,A,L,'HAL',true);
}
$('langBtn').onclick=function(){lang=lang==='id'?'en':'id';store.set('drLang',lang);applyStatic();
  if(st.phase==='guess'||st.phase==='reveal'){var L=st.R[st.i];$('lvTitle').textContent=L.title[lang];$('lvSub').textContent=t('round',{n:st.i+1,t:st.R.length});drawPlan();
    if(st.phase==='guess'){var keep=st.t0;renderSide();st.t0=keep}else renderSide()}
  else if(st.phase==='end'){if($('endBox').classList.contains('hidden'))drawIntroArt();else renderEnd()} else drawIntroArt();
  if(!$('hostBox').classList.contains('hidden')){if(st.host&&!$('dash').classList.contains('hidden')&&st.host.data)renderDash();else renderMySess()}};
$('startBtn').onclick=start;$('mobLock').onclick=function(){lockAnswer()};
applyStatic();dots();drawIntroArt();initApi();
window.__DR={LEVELS:LEVELS,analyze:analyze,sharedEdge:sharedEdge};
})();
</script>
</body>
</html>
