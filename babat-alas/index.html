<body>
<a class="home" href="https://pindotutuko.id/" id="homeLink"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-t="home">Beranda</span></a>
<div id="view"></div>

<!-- Layar: masuk / daftar -->
<section class="screen" id="scAuth">
  <div class="box">
    <div class="logo"><div class="mk">🪓</div><div><h1>Babat Alas</h1><small data-t="tag"></small></div></div>
    <p data-t="intro"></p>
    <div class="tabs"><button id="tbLogin" class="on" data-t="login"></button><button id="tbReg" data-t="register"></button></div>
    <form id="fAuth" autocomplete="on">
      <div class="fld"><label for="aUser" data-t="user"></label><input id="aUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}"></div>
      <div class="fld"><label for="aPass" data-t="pass"></label><div class="pwbox"><input id="aPass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required minlength="6"><button type="button" id="aEye" class="pweye" aria-label="Tampilkan kata sandi" title="Tampilkan / sembunyikan kata sandi">👁</button></div></div>
      <div id="regFields" class="hidden">
        <div class="fld"><label for="aKampus" data-t="kampus"></label><input id="aKampus" maxlength="80"></div>
        <div class="fld"><label for="aKelas" data-t="kelas"></label><input id="aKelas" maxlength="12" style="text-transform:uppercase"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="bigbtn" type="submit" id="aGo"></button><button class="bigbtn alt" type="button" id="aGuest" data-t="guest"></button><button class="bigbtn alt" type="button" id="langBtn">EN</button></div>
      <div class="err" id="aErr"></div>
      <p class="note" data-t="privacy"></p>
      <p class="note"><a href="/babat-alas/Panduan-Babat-Alas.pdf" target="_blank" rel="noopener" download style="color:var(--accent,#1f6f4f);font-weight:700">📘 <span data-t="guidePdf">Unduh panduan permainan (PDF)</span></a></p>
    </form>
  </div>
</section>

<!-- Layar: lanjutkan atau baru -->
<section class="screen hidden" id="scHub">
  <div class="box">
    <div class="logo"><div class="mk">🏡</div><div><h1 id="hubHello"></h1><small id="hubSub"></small></div></div>
    <div id="hubSave"></div>
    <div class="row" style="margin-top:14px"><button class="bigbtn gold hidden" id="hubCont" data-t="continue"></button><button class="bigbtn" id="hubNew" data-t="newgame"></button><button class="bigbtn alt" id="hubOut" data-t="logout"></button></div>
    <div class="err" id="hubErr"></div>
  </div>
</section>

<!-- Layar: tokoh -->
<section class="screen hidden" id="scChar">
  <div class="box wide">
    <h2 data-t="charH"></h2><p data-t="charP"></p>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px" class="cgrid">

        <div class="fld"><label for="cName" data-t="cName"></label><input id="cName" maxlength="40" required></div>

        <div class="fld"><label for="cMotto" data-t="cMotto"></label><input id="cMotto" maxlength="90"></div>
      </div>
      <div>
        <div class="fld"><label data-t="cStyle"></label><div class="styles" id="cStyles"></div></div>
        <p class="note" data-t="cStyleP"></p>
      </div>
    </div>
    <div class="row" style="margin-top:12px"><button class="bigbtn" id="cNext" data-t="next"></button><button class="bigbtn alt" id="cBack" data-t="back"></button></div>
    <div class="err" id="cErr"></div>
  </div>
</section>

<!-- Layar: lokasi -->
<section class="screen hidden" id="scLoc">

    <h2 data-t="locH"></h2><p data-t="locP"></p>

      <div class="note" id="lInfo" style="flex:1;min-width:220px"></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="bigbtn gold" id="lGo" data-t="start"></button><button class="bigbtn alt" id="lBack" data-t="back"></button></div>
    <p class="note" data-t="osm"></p>
    <div class="err" id="lErr"></div>
  </div>

<div id="hud" class="hidden">
  <div class="who"><div class="av" id="hAv"></div><div><b id="hName"></b><small id="hTitle"></small></div></div>

<div class="side hidden" id="missions"></div>
<div class="side hidden" id="info"></div>
<div class="side hidden" id="menu"></div>
<div id="styleBar" class="hidden"></div>
<div id="bar" class="hidden"></div>
<div id="advisor" class="off"></div>
<div id="toast"></div>
<div id="modal" class="modal hidden"></div>
