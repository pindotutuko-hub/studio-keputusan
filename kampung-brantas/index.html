<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kampung Brantas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f3efe7;--card:#fffdf9;--ink:#1f1c18;--muted:#6d655a;--line:#ddd3c4;
  --accent:#8a2b2b;--accent2:#b5523b;--accentSoft:#f3e2dc;--ok:#2f7d4f;--okSoft:#e1f1e6;--warn:#b7791f;--warnSoft:#fbf0d9;--bad:#a33a2a;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 24px rgba(40,30,20,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f;--card:#1f1c17;--ink:#f2ece2;--muted:#a69d8f;--line:#38322a;
  --accent:#e08a7a;--accent2:#e3a06c;--accentSoft:#3a2420;--ok:#6cc58f;--okSoft:#1c3326;--warn:#e3b45c;--warnSoft:#3a3020;--bad:#ef8a78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;background:#2f6f8f;display:grid;place-items:center;flex:none}
.brand h1{font-size:22px}.brand p{margin:0;color:var(--muted);font-size:13px}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.pill b{font-family:"Space Grotesk",Inter,sans-serif;font-size:15px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.mapcard{padding:12px}
.maphead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 4px 10px}
.maphead h2{font-size:17px;margin-right:auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
#map{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation;user-select:none}
.tile{cursor:pointer}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:8px 6px 0;min-height:26px;flex-wrap:wrap}
.legend .bar{flex:1;height:10px;border-radius:6px;max-width:240px;min-width:120px}
.info{font-size:12.5px;color:var(--muted);padding:6px 6px 0;min-height:22px}
.side{display:flex;flex-direction:column;gap:12px}
.panel{padding:14px 16px}
.panel h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tool{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:transparent;border-radius:12px;padding:7px 8px;text-align:left;font-size:13px}
.tool.on{border-color:var(--accent);background:var(--accentSoft)}
.tool svg{width:28px;height:28px;flex:none;border-radius:6px}
.tool small{display:block;color:var(--muted);font-size:11.5px}
.tool b{font-weight:600}
.ind{margin:7px 0}
.ind .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.ind .top span{font-family:"Space Grotesk",Inter,sans-serif}
.ind .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.ind .bar i{display:block;height:100%;border-radius:5px;transition:width .4s,background .4s}
.ind small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.event{border-radius:14px;padding:12px 14px;background:var(--warnSoft)}
.event b{font-family:"Space Grotesk",Inter,sans-serif}
.event p{margin:4px 0 0;font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
@media (prefers-color-scheme:dark){.btn{color:#1a120f}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.log{font-size:12.5px;max-height:160px;overflow:auto;margin:0;padding-left:18px}
.log li{margin:3px 0}
.good{color:var(--ok)}.badc{color:var(--bad)}
.intro{padding:26px;display:grid;gap:22px;grid-template-columns:1.1fr 1fr;align-items:center}
@media (max-width:900px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:30px;line-height:1.15}
.intro ul{padding-left:20px;margin:8px 0}
.intro li{margin:5px 0}
.hint{color:var(--muted);font-size:13px}
.big{font-family:"Space Grotesk",Inter,sans-serif;font-size:52px;font-weight:700;color:var(--accent);line-height:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
footer{margin-top:20px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted)}
.home{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px 7px 8px;font-weight:700;font-size:13px}
.home:hover{border-color:var(--accent);color:var(--accent)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1}
details{font-size:12.5px;color:var(--muted)}details summary{cursor:pointer;color:var(--ink);font-weight:600}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-1px)}}
.waves{animation:wave 3s linear infinite}
@media (prefers-reduced-motion:reduce){.waves{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="https://pindotutuko.id/" title="Beranda pindotutuko.id"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-t="home"></span></a>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l5-4 5 4v7H3z"/><path d="M13 13l4-3 4 3v5h-8"/><path d="M2 21c2-1.2 4-1.2 6 0s4 1.2 6 0 4-1.2 6 0"/></svg></div>
    <div class="brand"><h1>Kampung Brantas</h1><p data-t="tag"></p></div>
    <div class="hud">
      <div class="pill"><span data-t="year"></span> <b id="hYear">1/8</b></div>
      <div class="pill"><span data-t="fund"></span> <b id="hFund">0</b></div>
      <div class="pill"><span data-t="score"></span> <b id="hScore">0</b></div>
      <button class="lang" id="langBtn">EN</button>
    </div>
  </header>

  <section class="card intro" id="intro">
    <div>
      <h2 data-t="introH"></h2>
      <p class="hint" data-t="introP"></p>
      <ul><li data-t="g1"></li><li data-t="g2"></li><li data-t="g3"></li><li data-t="g4"></li><li data-t="g5"></li></ul>
      <p class="hint" data-t="introNote"></p>
      <div class="row" style="margin-top:12px"><button class="btn" id="startBtn" data-t="start"></button></div>
      <p class="hint" id="bestLine" style="margin-top:8px"></p>
    </div>
    <svg id="introMap" viewBox="0 0 16 11" style="width:100%;border-radius:12px"></svg>
  </section>

  <section class="card intro hidden" id="endBox"></section>

  <section class="grid hidden" id="game">
    <div class="card mapcard">
      <div class="maphead">
        <h2 data-t="mapH"></h2>
        <button class="chip on" data-ov="none" data-t="ovNone"></button>
        <button class="chip" data-ov="int" data-t="ovInt"></button>
        <button class="chip" data-ov="acc" data-t="ovAcc"></button>
        <button class="chip" data-ov="run" data-t="ovRun"></button>
        <button class="chip" data-ov="heat" data-t="ovHeat"></button>
      </div>
      <svg id="map" viewBox="0 0 16 11" role="img"></svg>
      <div class="legend" id="legend"></div>
      <div class="info" id="info"></div>
    </div>
    <div class="side">
      <div class="card panel">
        <h3><span data-t="toolsH"></span><button class="chip" id="undoBtn" data-t="undo"></button></h3>
        <div class="tools" id="tools"></div>
        <p class="hint" id="toolHint" style="margin:8px 0 0"></p>
      </div>
      <div class="card panel">
        <div class="event" id="eventBox"></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="endYear"></button></div>
        <ul class="log" id="log"></ul>
      </div>
      <div class="card panel">
        <h3><span data-t="indH"></span><span class="hint" id="totLine"></span></h3>
        <div id="inds"></div>
        <details><summary data-t="how"></summary><div id="howTxt"></div></details>
      </div>
    </div>
  </section>

  <footer>
    <span data-t="ref"></span>
    <span><span data-t="by"></span> <a href="https://pindotutuko.id" target="_blank" rel="noopener">pindotutuko.id</a></span>
  </footer>
</div>
<div class="toast" id="toast"></div>

/* ---------- Metrics ---------- */
function metrics(){
  var g=st.g,bio=st.bio,x,y,i;
  var INF=1e9,steps=[],q=[];
  for(y=0;y<H;y++){steps.push([]);for(x=0;x<W;x++){steps[y].push(INF);if(g[y][x]==='R'){steps[y][x]=0;q.push([x,y])}}}
  for(i=0;i<q.length;i++){var c=q[i];nb4(c[0],c[1]).forEach(function(n){if(WALK[g[n[1]][n[0]]]&&steps[n[1]][n[0]]===INF){steps[n[1]][n[0]]=steps[c[1]][c[0]]+1;q.push(n)}})}
  // houses: steps = min neighbour walk + 1
  var hs=[],conn=0,kk=0,sumSteps=0,unconn=[],bankKK=0;
  for(y=0;y<H;y++){hs.push([]);for(x=0;x<W;x++){var tp=g[y][x],v=INF;
    if(KK[tp]||tp==='f'){nb4(x,y).forEach(function(n){var s=steps[n[1]][n[0]];if(WALK[g[n[1]][n[0]]]&&s<INF)v=Math.min(v,s+1)})}
    hs[y].push(v);
    if(KK[tp]){kk+=KK[tp];if(v<INF){conn+=KK[tp];sumSteps+=v*KK[tp]}else if(tp==='h')unconn.push([x,y]);if(y===BANK)bankKK+=KK[tp]}}}
  var meanSteps=conn?sumSteps/conn:0;
  var acc=kk?Math.round(Math.max(0,Math.min(100,100*conn/kk-Math.max(0,meanSteps-4)*5))):0;
  // integration on walkable tile graph (per component)
  var integ=[],nodes=[],idx={};for(y=0;y<H;y++){integ.push([]);for(x=0;x<W;x++){integ[y].push(null);if(WALK[g[y][x]]){idx[x+','+y]=nodes.length;nodes.push([x,y])}}}
  var comp=new Array(nodes.length).fill(-1),comps=[];
  nodes.forEach(function(n,ni){if(comp[ni]>=0)return;var cq=[ni];comp[ni]=comps.length;for(var a=0;a<cq.length;a++){var p=nodes[cq[a]];nb4(p[0],p[1]).forEach(function(m){var mi=idx[m[0]+','+m[1]];if(mi!=null&&comp[mi]<0){comp[mi]=comps.length;cq.push(mi)}})}comps.push(cq)});
  var gangI=[],imax=0,imin=Infinity;
  comps.forEach(function(cq){var k=cq.length;if(k<3)return;var Dk=2*(k*(Math.log2((k+2)/3)-1)+1)/((k-1)*(k-2));
    cq.forEach(function(s){var d={};d[s]=0;var bq=[s],td=0;for(var a=0;a<bq.length;a++){var p=nodes[bq[a]];nb4(p[0],p[1]).forEach(function(m){var mi=idx[m[0]+','+m[1]];if(mi!=null&&d[mi]==null){d[mi]=d[bq[a]]+1;td+=d[mi];bq.push(mi)}})}
      var MD=td/(k-1),RA=2*(MD-1)/(k-2),I=RA>0?Dk/RA:0;var p=nodes[s];integ[p[1]][p[0]]=I;if(I>imax)imax=I;if(I<imin)imin=I;if(g[p[1]][p[0]]!=='R')gangI.push(I)})});
  // runoff
  var sumC=0,nl=0,run=[];for(y=0;y<H;y++){run.push([]);for(x=0;x<W;x++){var tp2=g[y][x];if(tp2==='W'){run[y].push(null);continue}var cc=bio[y][x]&&RUN_BIO[tp2]!=null?RUN_BIO[tp2]:RUN[tp2];run[y].push(cc);sumC+=cc;nl++}}
  var C=sumC/nl,fld=Math.round(Math.max(0,Math.min(100,100*(1-(C-.6)/.3)-2*bankKK)));
  // heat
  var heat=[],sumH=0,green=0;for(y=0;y<H;y++){heat.push([]);for(x=0;x<W;x++){var b=HEAT[g[y][x]],s2=0,n2=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;s2+=HEAT[g[yy][xx]];n2++}
    var hv=.5*b+.5*(s2/n2);heat[y].push(hv);if(g[y][x]!=='W'){sumH+=hv;if(g[y][x]==='r'||g[y][x]==='t')green++}}}
  var Hm=sumH/nl,hsc=Math.round(Math.max(0,Math.min(100,100*(1-(Hm-.55)/.3))));
  // housing
  var cap=kk,disp=Math.max(0,st.k0-cap),home=Math.max(0,100-8*disp);
  // facilities: walkable tiles within 4 steps of park/hall
  var fd=[],fq=[];for(y=0;y<H;y++){fd.push([]);for(x=0;x<W;x++)fd[y].push(INF)}
  for(y=0;y<H;y++)for(x=0;x<W;x++){if(g[y][x]==='r'){fd[y][x]=0;fq.push([x,y])}else if(g[y][x]==='f'){nb4(x,y).forEach(function(n){if(WALK[g[n[1]][n[0]]]&&fd[n[1]][n[0]]>0){fd[n[1]][n[0]]=0;fq.push(n)}})}}
  for(i=0;i<fq.length;i++){var c2=fq[i];nb4(c2[0],c2[1]).forEach(function(n){if(WALK[g[n[1]][n[0]]]&&fd[n[1]][n[0]]===INF){fd[n[1]][n[0]]=fd[c2[1]][c2[0]]+1;fq.push(n)}})}
  var near=0;for(y=0;y<H;y++)for(x=0;x<W;x++){var tp3=g[y][x];if(!KK[tp3])continue;var best=INF;nb4(x,y).forEach(function(n){if(WALK[g[n[1]][n[0]]])best=Math.min(best,fd[n[1]][n[0]]+1)});if(best<=4)near+=KK[tp3]}
  var fac=kk?Math.round(100*near/kk):0;
  var nbio=0;for(y=0;y<H;y++)for(x=0;x<W;x++)if(bio[y][x])nbio++;
  var total=Math.round((acc+fld+hsc+home+fac)/5);
  return {steps:steps,hs:hs,integ:integ,imax:imax,imin:imin===Infinity?0:imin,run:run,heat:heat,
    acc:acc,conn:conn,kk:kk,meanSteps:meanSteps,unconn:unconn,C:C,bankKK:bankKK,fld:fld,Hm:Hm,green:green/nl,hsc:hsc,cap:cap,disp:disp,home:home,fac:fac,near:near,nbio:nbio,total:total,
    gangI:gangI.length?gangI.reduce(function(a,b){return a+b},0)/gangI.length:0};
}

/* ---------- Overlays ---------- */
var STOPS=[[43,90,168],[74,163,196],[143,196,120],[240,200,70],[232,120,50],[190,40,40]];
function heatc(tt){tt=Math.max(0,Math.min(1,tt));var p=tt*(STOPS.length-1),i=Math.min(STOPS.length-2,Math.floor(p)),f=p-i,a=STOPS[i],b=STOPS[i+1];return [0,1,2].map(function(j){return Math.round(a[j]+(b[j]-a[j])*f)})}
function rgb(c){return 'rgb('+c.join(',')+')'}
function inkOn(c){return (0.299*c[0]+0.587*c[1]+0.114*c[2])>150?'#1b1814':'#ffffff'}
function ovVal(x,y){var m=st.m,tp=st.g[y][x],c;
  if(st.ov==='int'){var I=m.integ[y][x];if(I==null)return null;var tt=m.imax>m.imin?(I-m.imin)/(m.imax-m.imin):.5;c=heatc(tt);return {c:rgb(c)}}
  if(st.ov==='acc'){if(!(KK[tp]||tp==='f'))return null;var s=m.hs[y][x];if(s>=1e9)return {c:'#3a3a3a',txt:'×',ink:'#fff'};c=heatc(Math.min(1,(s-1)/9));return {c:rgb(c),txt:String(s),ink:inkOn(c)}}
  if(st.ov==='run'){var r=m.run[y][x];if(r==null)return null;c=heatc((r-.1)/.8);return {c:rgb(c)}}
  if(st.ov==='heat'){var h=m.heat[y][x];c=heatc((h-.1)/.8);return {c:rgb(c)}}
  return null}
function legend(){var L=$('legend');var map={int:['legInt','legInt2'],acc:['legAcc','legAcc2'],run:['legRun','legRun2'],heat:['legHeat','legHeat2']}[st.ov];
  if(!map){L.innerHTML='';return}var stops=[];for(var i=0;i<=10;i++)stops.push(rgb(heatc(i/10))+' '+(i*10)+'%');

/* ---------- Actions ---------- */
function toast(msg){var e=$('toast');e.textContent=msg;e.classList.add('on');clearTimeout(st.tt);st.tt=setTimeout(function(){e.classList.remove('on')},1800)}
function costOf(tool,x,y){var tp=st.g[y][x],c=tool.c;if(tool.to&&tool.to!==tp&&(tp==='h'||tp==='u'||tp==='f'))c+=1;return c}
function apply(x,y){
  if(st.phase!=='play')return;var tool=TOOLS.filter(function(z){return z.id===st.tool})[0],tp=st.g[y][x];
  if(tool.id==='info'){showInfo(x,y);return}
  if(tp==='W'){toast(t('cantWater'));return}
  if(tp==='R'){toast(t('cantRoad'));return}
  if(tool.id==='bio'){if(tp!=='g'&&tp!=='r'){toast(t('bioNeed'));return}if(st.bio[y][x]){toast(t('bioHas'));return}}
  else if(tool.to===tp){toast(t('same'));return}
  if(tool.id==='balai'){var ok=nb4(x,y).some(function(n){return WALK[st.g[n[1]][n[0]]]});if(!ok){toast(t('balaiNeed'));return}}
  var c=costOf(tool,x,y);if(c>st.fund){toast(t('noFund'));return}
  st.undo.push({g:st.g.map(function(r){return r.slice()}),bio:st.bio.map(function(r){return r.slice()}),fund:st.fund,log:st.log.length});
  st.fund-=c;
  if(tool.id==='bio')st.bio[y][x]=true;else{st.g[y][x]=tool.to;if(tool.to!=='g'&&tool.to!=='r')st.bio[y][x]=false}

}

function showInfo(x,y){var m=st.m,tp=st.g[y][x],parts=[t('infoTile',{x:x,y:y,n:t('tl_'+tp)})];
  if(KK[tp]||tp==='f'){var s=m.hs[y][x];parts.push(s>=1e9?t('iNo'):t('iSteps',{s:s}))}
  if(m.integ[y][x]!=null)parts.push(t('iInt',{v:fmt(m.integ[y][x],2)}));
  if(m.run[y][x]!=null)parts.push(t('iC',{c:fmt(m.run[y][x],2)}));

/* ---------- Events ---------- */
function runEvent(id){var m=st.m,d=0,res=null;
  if(id==='rain'){d=m.fld<50?-5:2}
  else if(id==='heat'){d=m.hsc<45?-4:0}
  else if(id==='fire'){if(m.unconn.length){var p=m.unconn[Math.floor(Math.random()*m.unconn.length)];st.g[p[1]][p[0]]='e';res=t('burned',{x:p[0],y:p[1]})}}
  else if(id==='flood'){d=-m.bankKK-(m.fld<40?3:0)}
  else if(id==='visit'){d=m.fac>=60?6:0}
  else if(id==='csr'){d=6}
  else if(id==='dry'){d=m.nbio>=4?3:-2}
  else if(id==='comm'){d=m.disp===0?4:-4}
  st.fund=Math.max(0,st.fund+d);
  var r=res||(d>0?t('gain',{n:d}):d<0?t('loss',{n:-d}):t('nothing'));
  st.log.unshift({txt:t('evRes',{e:t('ev_'+id),r:r}),k:d<0||res?'bad':d>0?'good':''});
}
function endYear(){
  if(st.phase!=='play')return;
  runEvent(st.events[st.year-1]);st.m=metrics();
  if(st.year>=YEARS){st.phase='end';refresh();setTimeout(renderEnd,350);return}
  st.year++;st.fund+=INCOME;st.undo=[];st.log.unshift({txt:t('income',{y:st.year,n:INCOME}),k:'good'});refresh();
}

/* ---------- UI ---------- */
function toolIcon(tool){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 1 1');
  if(tool.icon==='bio'){drawTile(s,0,0,'g',true)}else if(tool.icon==='info'){el('rect',{width:1,height:1,fill:'#e7dcc8'},s);el('circle',{cx:.45,cy:.45,r:.22,fill:'none',stroke:'#1f1c18','stroke-width':.08},s);el('path',{d:'M.62 .62L.85 .85',stroke:'#1f1c18','stroke-width':.1,'stroke-linecap':'round'},s)}
  else drawTile(s,0,0,tool.icon,false);return s}
function renderTools(){var box=$('tools');box.innerHTML='';TOOLS.forEach(function(tool){var b=document.createElement('button');b.className='tool'+(st.tool===tool.id?' on':'');
  b.appendChild(toolIcon(tool));var d=document.createElement('span');d.innerHTML='<b>'+t('t_'+tool.id)+'</b><small>'+(tool.c?t(tool.c===1?'cost1':'cost',{c:tool.c})+' · ':'')+t('d_'+tool.id)+'</small>';b.appendChild(d);
  b.onclick=function(){st.tool=tool.id;renderTools();$('toolHint').textContent=tool.to?t('demolHint'):t('d_'+tool.id)};box.appendChild(b)});
  if(!$('toolHint').textContent)$('toolHint').textContent=t('pickTool')}
function colorFor(v){return v>=70?'var(--ok)':v>=45?'var(--warn)':'var(--bad)'}
function renderInds(){var m=st.m;var rows=[
  ['acc',m.acc,t('s_acc',{p:Math.round(100*m.conn/Math.max(1,m.kk)),m:fmt(m.meanSteps,1)})],
  ['fld',m.fld,t('s_fld',{c:fmt(m.C,2),n:m.bankKK})],
  ['heat',m.hsc,t('s_heat',{h:fmt(m.Hm,2),g:Math.round(100*m.green)})],
  ['home',m.home,t('s_home',{cap:m.cap,k0:st.k0,d:m.disp?t('s_homeD',{d:m.disp}):''})],
  ['fac',m.fac,t('s_fac',{p:m.fac})]];
  $('inds').innerHTML=rows.map(function(r){var d=r[1]-st.m0[{acc:'acc',fld:'fld',heat:'hsc',home:'home',fac:'fac'}[r[0]]];
    return '<div class="ind"><div class="top">'+t('ind_'+r[0])+'<span>'+r[1]+(d?' <small style="display:inline;color:'+(d>0?'var(--ok)':'var(--bad)')+'">('+(d>0?'+':'')+d+')</small>':'')+'</span></div><div class="bar"><i style="width:'+r[1]+'%;background:'+colorFor(r[1])+'"></i></div><small>'+r[2]+'</small></div>'}).join('');
  $('totLine').textContent=t('total',{s:m.total});$('howTxt').innerHTML=t('howTxt')}
function renderEvent(){var id=st.events[st.year-1];$('eventBox').innerHTML='<div class="hint">'+t('fc')+'</div><b>'+t('ev_'+id)+'</b><p>'+t('evd_'+id)+'</p>';
  $('endYear').textContent=st.year>=YEARS?t('endGame'):t('endYear',{y:st.year})}
function renderLog(){$('log').innerHTML=st.log.slice(0,40).map(function(l){return '<li class="'+(l.k==='good'?'good':l.k==='bad'?'badc':'')+'">'+l.txt+'</li>'}).join('')}
function hud(){$('hYear').textContent=Math.min(st.year,YEARS)+'/'+YEARS;$('hFund').textContent=st.fund;$('hScore').textContent=st.m.total}
function refresh(){st.m=metrics();drawMap($('map'),true);legend();renderInds();renderEvent();renderLog();hud();if(st.hover)showInfo(st.hover[0],st.hover[1])}
function applyStatic(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(function(n){n.innerHTML=t(n.getAttribute('data-t'))});
  $('langBtn').textContent=lang==='id'?'EN':'ID';var b=store.get('kbBest');$('bestLine').textContent=b?t('best',{s:b}):''}
function show(id){['intro','endBox','game'].forEach(function(x){$(x).classList.toggle('hidden',x!==id)});window.scrollTo(0,0)}
function start(){fresh();show('game');$('toolHint').textContent='';renderTools();refresh()}
function rating(s){return s>=75?'r3':s>=60?'r2':s>=45?'r1':'r0'}
function renderEnd(){var m=st.m,m0=st.m0,s=m.total,r=rating(s);var b=+(store.get('kbBest')||0);if(s>b)store.set('kbBest',s);
  show('endBox');var rows=[['ind_acc','acc'],['ind_fld','fld'],['ind_heat','hsc'],['ind_home','home'],['ind_fac','fac']];
  $('endBox').innerHTML='<div><h2>'+t('endH')+'</h2><p class="hint">'+t('endTotal')+'</p><div class="big">'+s+' <span style="font-size:20px;color:var(--muted)">/ 100</span></div><p style="font-family:Space Grotesk,Inter,sans-serif;font-size:20px;font-weight:700;margin:8px 0 12px">'+t(r)+'</p>'+
   '<table><thead><tr><th></th><th>'+t('start_')+'</th><th>'+t('end_')+'</th><th>'+t('changeH')+'</th></tr></thead><tbody>'+rows.map(function(x){var d=m[x[1]]-m0[x[1]];return '<tr><td>'+t(x[0])+'</td><td>'+m0[x[1]]+'</td><td><b>'+m[x[1]]+'</b></td><td class="'+(d>0?'good':d<0?'badc':'')+'">'+(d>0?'+':'')+d+'</td></tr>'}).join('')+
   '<tr><td><b>'+t('score')+'</b></td><td>'+m0.total+'</td><td><b>'+m.total+'</b></td><td class="'+(m.total>m0.total?'good':'badc')+'">'+(m.total-m0.total>0?'+':'')+(m.total-m0.total)+'</td></tr></tbody></table>'+
   '<div class="row" style="margin-top:14px"><button class="btn" id="againBtn">'+t('again')+'</button><button class="btn ghost" id="copyBtn">'+t('copy')+'</button><button class="btn ghost" id="menuBtn">'+t('backMenu')+'</button></div></div>'+
   '<svg id="endMap" viewBox="0 0 16 11" style="width:100%;border-radius:12px"></svg>';
  drawMap($('endMap'),false);
  $('againBtn').onclick=start;$('menuBtn').onclick=function(){st.phase='menu';show('intro');applyStatic()};
  $('copyBtn').onclick=function(){var bt=this,txt=t('shareTxt',{s:s,r:t(r)})+' pindotutuko.id';try{navigator.clipboard.writeText(txt).then(function(){bt.textContent=t('copied')},function(){bt.textContent=t('copyFail')})}catch(e){bt.textContent=t('copyFail')}}}

document.querySelectorAll('[data-ov]').forEach(function(b){b.onclick=function(){st.ov=b.getAttribute('data-ov');document.querySelectorAll('[data-ov]').forEach(function(c){c.classList.toggle('on',c===b)});refresh()}});
$('undoBtn').onclick=undo;$('endYear').onclick=endYear;$('startBtn').onclick=start;
$('map').addEventListener('mouseleave',function(){st.hover=null;hl()});
$('langBtn').onclick=function(){lang=lang==='id'?'en':'id';store.set('kbLang',lang);applyStatic();if(st.phase==='play'&&!$('game').classList.contains('hidden')){$('toolHint').textContent=t('pickTool');renderTools();refresh()}else if(st.phase==='end'&&!$('endBox').classList.contains('hidden'))renderEnd()};
applyStatic();fresh();st.phase='menu';drawMap($('introMap'),false);
window.__KB={metrics:function(){return st.m},st:function(){return st},apply:apply,endYear:endYear,setTool:function(id){st.tool=id}};
})();
</script>
</body>
</html>
