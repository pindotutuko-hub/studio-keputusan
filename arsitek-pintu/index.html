<style>
:root{
  --bg:#f3efe7;--card:#fffdf9;--ink:#1f1c18;--muted:#6d655a;--line:#ddd3c4;--soft:#efe8dc;
  --room:#efe6d7;--roomh:#e4d3b8;--door:#c9922e;--cand:#a8987d;
  --accent:#1f6f6b;--accentSoft:#dcefed;--ok:#2f7d4f;--okSoft:#e1f1e6;--bad:#a33a2a;--badSoft:#f6e1dc;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 24px rgba(40,30,20,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f;--card:#1f1c17;--ink:#f2ece2;--muted:#a69d8f;--line:#38322a;--soft:#2a261f;
  --room:#2b2720;--roomh:#3b3428;--door:#e0ae4e;--cand:#5d554a;
  --accent:#6fd0c8;--accentSoft:#173230;--ok:#6cc58f;--okSoft:#1c3326;--bad:#ef8a78;--badSoft:#3a2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk",Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.home{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px 7px 8px;font-weight:700;font-size:13px}
.home:hover{border-color:var(--accent);color:var(--accent)}
.logo{width:42px;height:42px;border-radius:12px;background:#1f6f6b;display:grid;place-items:center;flex:none}
.brand h1{font-size:22px}.brand p{margin:0;color:var(--muted);font-size:13px}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.pill b{font-family:"Space Grotesk",Inter,sans-serif;font-size:15px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lv{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600;text-align:left}
.lv.on{border-color:var(--accent);background:var(--accentSoft)}
.lv small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.lv .st{color:#d29a1e;letter-spacing:1px}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:16px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.plan{padding:14px}
.planhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 8px;flex-wrap:wrap}
.planhead h2{font-size:18px}
#plan{width:100%;height:auto;display:block;touch-action:manipulation;max-height:66vh}
.wall{cursor:pointer}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:8px 4px 0;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.side{display:flex;flex-direction:column;gap:12px}
.panel{padding:14px 16px}
.panel h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.req{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.req i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:var(--badSoft);color:var(--bad)}
.req.ok i{background:var(--okSoft);color:var(--ok)}
.req small{display:block;color:var(--muted);font-size:12px}
.win{border-radius:14px;padding:12px 14px;background:var(--okSoft)}
.win b{font-family:"Space Grotesk",Inter,sans-serif;font-size:17px}
.stars{color:#d29a1e;font-size:22px;letter-spacing:3px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 15px;font-weight:700;font-size:14.5px}
@media (prefers-color-scheme:dark){.btn{color:#0f1f1e}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:13px}
#jg{width:100%;height:auto;display:block}
.intro{padding:24px;margin-bottom:12px}
.intro h2{font-size:24px}
footer{margin-top:20px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted)}
.hidden{display:none!important}
.vt{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.vt button{border:0;background:transparent;padding:5px 12px;font-size:12.5px;font-weight:700}.vt button.on{background:var(--ink);color:var(--card)}
#plan3d{width:100%;aspect-ratio:4/3;max-height:70vh;border-radius:12px;overflow:hidden;position:relative;touch-action:none;background:#cfe3f2}
#plan3d .tourHud{position:absolute;left:10px;top:10px;background:rgba(20,18,15,.72);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;pointer-events:none}
.planwrap{position:relative}
.nav3d{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}.nav3d button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.9);color:#1f1c18;font-size:17px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}.nav3d button.on{background:#1f1c18;color:#fff}
.wmenu{position:absolute;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:8px;min-width:210px}
.wmenu b{display:block;font-size:12.5px;margin:2px 4px 6px;color:var(--muted);font-weight:600}
.wmenu button{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 8px;font-size:13.5px;font-weight:600;text-align:left}
.wmenu button:hover,.wmenu button:focus{background:var(--soft);outline:none}.wmenu button.on{border-color:var(--accent);background:var(--accentSoft)}
.wmenu svg{flex:none}.wmenu small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.tourbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 4px 0}
.tourbar select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px}
@media (max-width:600px){.wrap{padding:12px 10px 40px}.brand h1{font-size:19px}.plan{padding:10px}.tools .hint{width:100%}#plan{max-height:none}}
</style>
</head>
