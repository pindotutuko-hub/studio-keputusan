name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node build-page.js
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: Build macOS dmg
        if: runner.os == 'macOS'
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Keputusan-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Studio Keputusan v${{ steps.v.outputs.version }}
          body: |
            Installer otomatis dari commit ${{ github.sha }}.
            - Windows: `Studio Keputusan Setup *.exe` (installer) atau `*-win.zip` (portabel)
            - macOS: `*.dmg` (universal, Intel & Apple Silicon). Belum ditandatangani Apple: klik kanan → Open saat pertama dibuka.
          files: out/*
