<style>
:root{
  --bg:#f3efe7;--card:#fffdf9;--ink:#1f1c18;--muted:#6d655a;--line:#ddd3c4;
  --accent:#8a2b2b;--accent2:#b5523b;--accentSoft:#f3e2dc;--ok:#2f7d4f;--okSoft:#e1f1e6;--warn:#b7791f;--warnSoft:#fbf0d9;--bad:#a33a2a;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 24px rgba(40,30,20,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f;--card:#1f1c17;--ink:#f2ece2;--muted:#a69d8f;--line:#38322a;
  --accent:#e08a7a;--accent2:#e3a06c;--accentSoft:#3a2420;--ok:#6cc58f;--okSoft:#1c3326;--warn:#e3b45c;--warnSoft:#3a3020;--bad:#ef8a78;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;background:#2f6f8f;display:grid;place-items:center;flex:none}
.brand h1{font-size:22px}.brand p{margin:0;color:var(--muted);font-size:13px}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.pill b{font-family:"Space Grotesk",Inter,sans-serif;font-size:15px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.mapcard{padding:12px}
.maphead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 4px 10px}
.maphead h2{font-size:17px;margin-right:auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
#map{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation;user-select:none}
.tile{cursor:pointer}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:8px 6px 0;min-height:26px;flex-wrap:wrap}
.legend .bar{flex:1;height:10px;border-radius:6px;max-width:240px;min-width:120px}
.info{font-size:12.5px;color:var(--muted);padding:6px 6px 0;min-height:22px}
.side{display:flex;flex-direction:column;gap:12px}
.panel{padding:14px 16px}
.panel h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tool{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:transparent;border-radius:12px;padding:7px 8px;text-align:left;font-size:13px}
.tool.on{border-color:var(--accent);background:var(--accentSoft)}
.tool svg{width:28px;height:28px;flex:none;border-radius:6px}
.tool small{display:block;color:var(--muted);font-size:11.5px}
.tool b{font-weight:600}
.ind{margin:7px 0}
.ind .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.ind .top span{font-family:"Space Grotesk",Inter,sans-serif}
.ind .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.ind .bar i{display:block;height:100%;border-radius:5px;transition:width .4s,background .4s}
.ind small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.event{border-radius:14px;padding:12px 14px;background:var(--warnSoft)}
.event b{font-family:"Space Grotesk",Inter,sans-serif}
.event p{margin:4px 0 0;font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
@media (prefers-color-scheme:dark){.btn{color:#1a120f}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.log{font-size:12.5px;max-height:160px;overflow:auto;margin:0;padding-left:18px}
.log li{margin:3px 0}
.good{color:var(--ok)}.badc{color:var(--bad)}
.intro{padding:26px;display:grid;gap:22px;grid-template-columns:1.1fr 1fr;align-items:center}
@media (max-width:900px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:30px;line-height:1.15}
.intro ul{padding-left:20px;margin:8px 0}
.intro li{margin:5px 0}
.hint{color:var(--muted);font-size:13px}
.big{font-family:"Space Grotesk",Inter,sans-serif;font-size:52px;font-weight:700;color:var(--accent);line-height:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
footer{margin-top:20px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted)}
.home{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px 7px 8px;font-weight:700;font-size:13px}
.home:hover{border-color:var(--accent);color:var(--accent)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1}
details{font-size:12.5px;color:var(--muted)}details summary{cursor:pointer;color:var(--ink);font-weight:600}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-1px)}}
.waves{animation:wave 3s linear infinite}
@media (prefers-reduced-motion:reduce){.waves{animation:none}}
.nav3d{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}.nav3d button{width:36px;height:36px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.88);color:#1f1c18;font-size:17px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}.nav3d button.on{background:#1f1c18;color:#fff}.hint3d{position:absolute;left:8px;bottom:8px;right:52px;background:rgba(20,18,15,.7);color:#fff;font-size:12px;padding:5px 9px;border-radius:8px;pointer-events:none;transition:opacity .6s}
</style>
<style id="rsp-fix">/* tata letak responsif: ponsel, tablet, iPad mini (Safari & Chrome) */
.grid>*,.intro>*,.side>*,.grid2>*{min-width:0}
svg,canvas,img,video{max-width:100%}
.intro svg{width:100%;height:auto;max-height:380px;display:block}
#plan3d,#map3d,#kp3d,#fs3d{min-width:0;max-width:100%}
#plan3d canvas,#map3d canvas,#kp3d canvas,#fs3d canvas{width:100%!important;height:100%!important;display:block}
@media (max-width:1100px){.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}}
</style>
</head>

  <section class="card intro" id="intro">
    <div>
      <h2 data-t="introH"></h2>
      <p class="hint" data-t="introP"></p>
      <ul><li data-t="g1"></li><li data-t="g2"></li><li data-t="g3"></li><li data-t="g4"></li><li data-t="g5"></li></ul>
      <p class="hint" data-t="introNote"></p>
      <div class="row" style="margin-top:12px"><button class="btn" id="startBtn" data-t="start"></button><span id="kelasSlot"></span></div>

      <p class="hint" id="bestLine" style="margin-top:8px"></p>
      <div id="inspIntro" style="margin-top:16px"></div>
    </div>
    <svg id="introMap" viewBox="0 0 16 11" style="width:100%;border-radius:12px"></svg>
  </section>

  <section class="card intro hidden" id="endBox"></section>

  <section class="grid hidden" id="game">
    <div class="card mapcard">
      <div class="maphead">
        <h2 data-t="mapH"></h2>
        <button class="chip on" data-ov="none" data-t="ovNone"></button>
        <button class="chip" data-ov="int" data-t="ovInt"></button>
        <button class="chip" data-ov="acc" data-t="ovAcc"></button>
        <button class="chip" data-ov="run" data-t="ovRun"></button>
        <button class="chip" data-ov="heat" data-t="ovHeat"></button>
        <button class="chip hidden" id="v3d">3D</button><select class="chip hidden" id="tod" aria-label="time"><option value="9">09.00</option><option value="13" selected>13.00</option><option value="17">17.00</option><option value="20">20.00</option></select>
      </div>
      <svg id="map" viewBox="0 0 16 11" role="img"></svg>

      <div class="legend" id="legend"></div>
      <div class="info" id="info"></div>
      <div id="inspGame" style="margin-top:12px"></div>
    </div>
    <div class="side">
      <div class="card panel">
        <h3><span data-t="toolsH"></span><button class="chip" id="undoBtn" data-t="undo"></button></h3>
        <div class="tools" id="tools"></div>
        <p class="hint" id="toolHint" style="margin:8px 0 0"></p>
      </div>
      <div class="card panel">
        <div class="event" id="eventBox"></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="endYear"></button></div>
        <ul class="log" id="log"></ul>
      </div>
      <div class="card panel">
        <h3><span data-t="indH"></span><span class="hint" id="totLine"></span></h3>
        <div id="inds"></div>
        <details><summary data-t="how"></summary><div id="howTxt"></div></details>
      </div>
    </div>
  </section>

  <footer>
    <span data-t="ref"></span>
    <span><span data-t="by"></span> <a href="https://pindotutuko.id" target="_blank" rel="noopener">pindotutuko.id</a></span>
  </footer>
</div>

function metrics(){

  // integration on walkable tile graph (per component)
  var integ=[],nodes=[],idx={};for(y=0;y<H;y++){integ.push([]);for(x=0;x<W;x++){integ[y].push(null);if(WALK[g[y][x]]){idx[x+','+y]=nodes.length;nodes.push([x,y])}}}

  var gangI=[],imax=0,imin=Infinity;
  comps.forEach(function(cq){var k=cq.length;if(k<3)return;var Dk=2*(k*(Math.log2((k+2)/3)-1)+1)/((k-1)*(k-2));
    cq.forEach(function(s){var d={};d[s]=0;var bq=[s],td=0;for(var a=0;a<bq.length;a++){var p=nodes[bq[a]];nb4(p[0],p[1]).forEach(function(m){var mi=idx[m[0]+','+m[1]];if(mi!=null&&d[mi]==null){d[mi]=d[bq[a]]+1;td+=d[mi];bq.push(mi)}})}
      var MD=td/(k-1),RA=2*(MD-1)/(k-2),I=RA>0?Dk/RA:0;var p=nodes[s];integ[p[1]][p[0]]=I;if(I>imax)imax=I;if(I<imin)imin=I;if(g[p[1]][p[0]]!=='R')gangI.push(I)})});
  // runoff
  var sumC=0,nl=0,run=[];for(y=0;y<H;y++){run.push([]);for(x=0;x<W;x++){var tp2=g[y][x];if(tp2==='W'){run[y].push(null);continue}var cc=bio[y][x]&&RUN_BIO[tp2]!=null?RUN_BIO[tp2]:RUN[tp2];run[y].push(cc);sumC+=cc;nl++}}

  // heat
  var heat=[],sumH=0,green=0;for(y=0;y<H;y++){heat.push([]);for(x=0;x<W;x++){var b=HEAT[g[y][x]],s2=0,n2=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;s2+=HEAT[g[yy][xx]];n2++}

  for(i=0;i<fq.length;i++){var c2=fq[i];nb4(c2[0],c2[1]).forEach(function(n){if(WALK[g[n[1]][n[0]]]&&fd[n[1]][n[0]]===INF){fd[n[1]][n[0]]=fd[c2[1]][c2[0]]+1;fq.push(n)}})}

<script>(function(){var src=document.querySelector('a.home');if(!src)return;var fab=src.cloneNode(true);fab.removeAttribute('id');fab.classList.add('homefab');fab.setAttribute('aria-hidden','true');fab.tabIndex=-1;document.body.appendChild(fab);
function chk(){var r=src.getBoundingClientRect(),show=false;if(!(r.width&&r.height)||r.bottom<4||r.top>innerHeight-4)show=true;else{var x=Math.min(innerWidth-1,Math.max(0,r.left+r.width/2)),y=Math.min(innerHeight-1,Math.max(0,r.top+r.height/2));var es=document.elementsFromPoint(x,y),e=null;for(var i=0;i<es.length;i++){if(es[i]!==fab&&!fab.contains(es[i])){e=es[i];break;}}if(e&&!src.contains(e))show=true;}
fab.innerHTML=src.innerHTML;fab.classList.toggle('on',show);fab.setAttribute('aria-hidden',show?'false':'true');fab.tabIndex=show?0:-1;}
addEventListener('scroll',chk,{passive:true});addEventListener('resize',chk);setInterval(chk,800);chk();})();</script>
